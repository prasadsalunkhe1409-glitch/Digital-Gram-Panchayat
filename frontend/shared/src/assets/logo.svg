<svg width="96" height="96" viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="96" height="96" rx="20" fill="#1E3B8B" />
  <!--
    Gram Panchayat mark: pedimented roof, entablature, three columns, foundation.

    The parts meet rather than float. At 32px a 3px gap in this geometry lands on a third of a
    device pixel and greys into a smudge, so the roof sits on the entablature and the columns
    stand on the foundation with no seam to lose. Symbol bounds are x 16-80 and y 18-77, which
    leaves 16px of plate on each side and 18/19px above and below: even padding, optically
    centred, and the same silhouette whether it is rendered at 96px or 32px.
  -->
  <path d="M48 18L80 40H16L48 18Z" fill="white" />
  <rect x="20" y="40" width="56" height="8" rx="1" fill="white" />
  <rect x="20" y="48" width="10" height="20" fill="white" />
  <rect x="43" y="48" width="10" height="20" fill="white" />
  <rect x="66" y="48" width="10" height="20" fill="white" />
  <rect x="16" y="68" width="64" height="9" rx="2" fill="white" />
</svg>
